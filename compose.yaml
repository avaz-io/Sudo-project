name: campusly

services:
  tests:
    image: campusly-tests:local
    build:
      context: .
      target: tests
    environment:
      SECRET_KEY: tests-only-secret-key-never-used-for-deployment
      DATABASE_URL: sqlite://
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    restart: "no"

  frontend-checks:
    image: campusly-frontend-checks:local
    build:
      context: .
      dockerfile: devops/Dockerfile.web
      target: frontend-checks
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    restart: "no"

  backend:
    image: campusly-backend:local
    build:
      context: .
      target: runtime
    depends_on:
      tests:
        condition: service_completed_successfully
      frontend-checks:
        condition: service_completed_successfully
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      DATABASE_URL: sqlite:////data/event_manager.db
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      UNIVERSITY_TIMEZONE: ${UNIVERSITY_TIMEZONE:-Asia/Tashkent}
      # The backend is internal; accept forwarded HTTPS headers from Compose peers.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - backend-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    image: campusly-web:local
    build:
      context: .
      dockerfile: devops/Dockerfile.web
      target: runtime
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-${BACKEND_PORT:-8000}}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  backend-data:
