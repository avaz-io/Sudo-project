worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    # ngrok terminates HTTPS before forwarding to this HTTP listener.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
        http http;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # No URI suffix on proxy_pass: FastAPI must receive the original /api path.
        location ~ ^/(?:api(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
            proxy_pass http://backend:8000;
        }

        location ~ /\. {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            error_page 503 = @frontend_unavailable;
            try_files $uri /index.html =503;
        }

        location @frontend_unavailable {
            default_type text/plain;
            return 503 "Frontend build is not available yet.\n";
        }
    }
}
